
name: Security Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Starting security checks"
          echo "Current user:"
          whoami
          echo "Operating system:"
          uname -a

      - name: Security check
        run: |
          echo "Security check completed"
